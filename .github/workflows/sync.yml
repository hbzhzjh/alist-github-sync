name: AList GitHub Auto Sync

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch: # 支持在 WordPress 后台或 GitHub 网页手动点击触发
  push:
    paths:
      - 'software.json' # 当软件清单更新提交时触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许回写更新后的 software.json 状态

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pyzipper; fi

      - name: Run AList Sync Engine
        env:
          ALIST_URL: ${{ secrets.ALIST_URL }}
          ALIST_TOKEN: ${{ secrets.ALIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_ZIP_PASSWORD: ${{ secrets.DEFAULT_ZIP_PASSWORD }}
          SOFTWARE_JSON_PATH: 'software.json'
        run: |
          python sync.py

      - name: Commit and Push Status Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          if [[ -n $(git status -s software.json sync_status.json) ]]; then
            git add software.json sync_status.json
            git commit -m "chore(sync): update software release and drive status [skip ci]"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; git merge -X ours origin/main --no-edit -m "chore: merge remote changes [skip ci]"; }
              if git push origin main; then
                echo "成功推送状态更新至 GitHub 仓库！"
                break
              fi
              echo "推送被拒或遇到并发冲突，等待 2 秒后重试第 $i 次..."
              sleep 2
            done
          else
            echo "没有状态变更，无需提交。"
          fi